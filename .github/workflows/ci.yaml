name: Java CI

on:
  push:
    branches:
      - main
      - CI_CD
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up JDK 22
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '22'

    - name: Cache Maven dependencies
      uses: actions/cache@v2
      with:
        path: ~/.m2/repository
        key: "${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}"
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Lint code with SuperLinter (Java only)
      uses: github/super-linter@v4
      env:
        RUN_LOCAL: false
        VALIDATE_JAVA: true

    - name: Build and test
      run: mvn clean test

    - name: Generate Coverage Report
      run: mvn jacoco:report
